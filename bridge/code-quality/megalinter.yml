# Managed by OMP Manager. Repository .mega-linter.yml is deliberately not loaded.
APPLY_FIXES: none
VALIDATE_ALL_CODEBASE: true
PARALLEL: false
ENABLE_LINTERS:
  - BASH_SHELLCHECK
  - C_CPPCHECK
  - CPP_CPPCHECK
  - COPYPASTE_JSCPD
  - DOCKERFILE_HADOLINT
  - JAVA_PMD
  - JAVASCRIPT_ES
  - JSX_ESLINT
  - TYPESCRIPT_ES
  - TSX_ESLINT
  - PYTHON_BANDIT
  - PYTHON_RUFF
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
  - REPOSITORY_BETTERLEAKS
PRE_COMMANDS: []
POST_COMMANDS: []
PLUGINS: []
EXTENDS: []
REPORT_OUTPUT_FOLDER: /out
JSON_REPORTER: true
JSON_REPORTER_FILE_NAME: mega-linter-report.json
JSON_REPORTER_OUTPUT_DETAIL: simple
SARIF_REPORTER: true
SARIF_REPORTER_FILE_NAME: megalinter.sarif
API_REPORTER: false
AZURE_COMMENT_REPORTER: false
BITBUCKET_COMMENT_REPORTER: false
CONFIG_REPORTER: false
EMAIL_REPORTER: false
FILEIO_REPORTER: false
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false
GITLAB_COMMENT_REPORTER: false
LLM_ADVISOR_ENABLED: false
MARKDOWN_SUMMARY_REPORTER: false
REDIS_REPORTER: false
REDIS_LINTER_REPORTER: false
TAP_REPORTER: false
TEXT_REPORTER: false
UPDATED_SOURCES_REPORTER: false
WEBHOOK_REPORTER: false
PRINT_ALL_FILES: false
SHOW_ELAPSED_TIME: true
LOG_LEVEL: WARNING
LOG_FILE: none
REPOSITORY_BETTERLEAKS_ARGUMENTS: [--redact=100, --no-banner, --validation=false]
REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN: false
REPOSITORY_CHECKOV_ARGUMENTS: [--skip-download, --compact, --quiet]
C_CPPCHECK_ARGUMENTS: [--enable=warning,performance,portability]
CPP_CPPCHECK_ARGUMENTS: [--enable=warning,performance,portability]
COPYPASTE_JSCPD_ARGUMENTS: [--min-tokens, '100', --min-lines, '10', --reporters, 'json,sarif']
