[package]
name = "omp-manager"
version = "0.1.0"
description = "OMP Manager backend (Tauri)"
edition = "2021"

# Standalone crate: never attach to a parent workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
uuid = { version = "=1.26.1", features = ["v4"] }
vt100 = "=0.16.2"
parking_lot = "=0.12.5"
sha2 = "=0.10.9"
toml = "=1.1.8"
roxmltree = "=0.21.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
tar = "=0.4.46"
ignore = "=0.4.33"
serde_yaml_ng = "=0.10.0"
flate2 = "=1.1.10"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_LibraryLoader", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
