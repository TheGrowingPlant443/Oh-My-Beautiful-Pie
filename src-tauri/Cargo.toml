[package]
name = "omp-manager"
version = "0.1.0"
description = "OMP Manager backend (Tauri)"
edition = "2021"

# Standalone crate: never attach to a parent workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
uuid = { version = "=1.26.1", features = ["v4"] }
vt100 = "=0.16.2"
parking_lot = "=0.12.5"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_LibraryLoader", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
